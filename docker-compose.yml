# PostgreSQL for local development (and a second DB for e2e tests).
services:
  postgres:
    image: postgres:16-alpine
    container_name: onlinemart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlinemart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: onlinemart
    ports:
      - "5432:5432"
    volumes:
      - onlinemart_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinemart -d onlinemart"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onlinemart_pgdata:
